<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Номерок | Генератор КПК</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ac:#ff1744;--bg:#07070c;--card:#ffffff0d;--card2:#1b1b24;--mut:#9494a6;--gold:#ffd54a;--ok:#3fe06b;--bad:#ff5468;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:var(--vh,100dvh);overflow:hidden;background:var(--bg);color:#fff;font-family:Rubik,system-ui,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button,input,select,textarea{font-family:inherit}
#bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#bgfx s{position:absolute;bottom:-80px;left:var(--lf);width:var(--sz);height:var(--sz);border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffffff24,#ffffff00 70%);animation:rise var(--du) linear infinite;animation-delay:var(--dl)}
@keyframes rise{to{transform:translate(30px,-115vh);opacity:.15}}
#aura{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 45% at 50% 38%,var(--ac),transparent 70%);opacity:.18;transition:background 1s,opacity 1s;animation:aur 5s ease-in-out infinite}
@keyframes aur{50%{transform:scale(1.1)}}
#app{position:relative;height:100%;width:100%;min-width:0;overflow-x:hidden;max-width:500px;margin:0 auto;display:flex;flex-direction:column;padding:calc(6px + env(safe-area-inset-top,0px)) 10px calc(66px + env(safe-area-inset-bottom,0px))}
#top{display:flex;gap:5px;align-items:center;margin-bottom:6px;flex:none}
.chip{background:var(--card);border:1px solid #ffffff14;border-radius:14px;padding:6px 9px;font-weight:800;font-size:12px;white-space:nowrap;color:#fff;backdrop-filter:blur(8px)}
#lv{flex:1;min-width:86px;display:flex;align-items:center;gap:6px;padding:6px 9px;cursor:pointer;transition:transform .12s}
#lv:active{transform:scale(.96)}
#lv i{flex:1;height:6px;border-radius:4px;background:#ffffff1f;overflow:hidden}#lv u{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#9dff6b);width:0;transition:width .5s;border-radius:4px}
nav .ping::after,.hub-btn.ping::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#ff3355;animation:pl 1s infinite alternate}
nav .ping::after{top:3px;right:22%}
#gb{cursor:pointer;font-size:12px;padding:6px 8px}
#gb.rdy{background:#3a0b14;border-color:#ff3355;animation:pl 1s infinite alternate}
#admBtn{background:linear-gradient(135deg,#ffd54a,#ff9100);color:#000;border:0;cursor:pointer;padding:6px 8px;font-size:12px;display:none}
@keyframes pl{to{box-shadow:0 0 15px #ff1744aa;transform:scale(1.03)}}
#bal{text-align:right;line-height:1.05;padding-left:2px}#bal small{display:block;color:var(--mut);font-size:10px;font-weight:500}#bal b{font-size:15px;display:inline-block;white-space:nowrap}
#bt.up{animation:bup .6s}#bt.dn{animation:bdn .6s}@keyframes bup{40%{color:var(--ok);transform:scale(1.12)}}@keyframes bdn{40%{color:var(--bad);transform:scale(.92)}}
.s{display:none;min-width:0}.s.on{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0;overflow-x:hidden;overflow-y:auto;animation:fin .22s ease-out}#s0.on{overflow:hidden}
@keyframes fin{from{opacity:0;transform:translateY(6px)}}
#activeBoosts{display:none;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:5px;flex:none}#activeBoosts.on{display:flex}
.b-pill{background:linear-gradient(135deg,#2a1836,#161224);border:1px solid #a855f766;border-radius:10px;padding:3px 8px;font-size:10px;font-weight:700;color:#e9d5ff;white-space:nowrap;display:flex;align-items:center;gap:4px}.b-pill b{color:var(--gold)}
#types{display:flex;gap:6px;margin-bottom:6px;flex:none}
.ty{flex:1;color:#fff;background:var(--card);border:1.5px solid transparent;border-radius:14px;padding:5px 6px;cursor:pointer;text-align:center;transition:.2s}
.ty b{font-size:13px;display:block}.ty small{display:block;color:var(--gold);font-weight:800;font-size:11px;margin-top:1px}
.ty.on{border-color:#ff3355;background:#2a1018;box-shadow:0 4px 14px #ff17442a}
#guar{display:flex;gap:4px;margin-bottom:6px;flex:none}
.gr{flex:1;min-width:0;color:#fff;background:var(--card);border:1.5px solid transparent;border-radius:12px;padding:4px 2px;cursor:pointer;text-align:center;line-height:1.2;transition:.2s}
.gr b{display:block;font-size:10.5px;white-space:nowrap}.gr small{display:block;color:var(--gold);font-weight:800;font-size:10px}
.gr.on{border-color:var(--gc);background:#ffffff14;box-shadow:0 3px 12px color-mix(in srgb,var(--gc) 30%,transparent)}
input,textarea,select{user-select:text;-webkit-user-select:text}
#head{background:var(--card);border:1px solid #ffffff10;border-radius:14px;padding:6px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none;margin-bottom:4px}
#rn{font-weight:800;font-size:14px;transition:color .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seg{display:flex;gap:4px;margin-top:4px}#seg i{width:20px;height:4px;border-radius:2px;background:#ffffff26;transition:background .3s}
#val{font-weight:800;font-size:16px;color:var(--gold);text-align:right;white-space:nowrap}
#stage{flex:1;min-height:130px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;align-content:center;padding:4px 0;position:relative}
#stage.multi{gap:6px 8px}
#stage .mwrap{display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s}#stage .mwrap:active{transform:scale(.94)}
#stage .mwrap small{margin-top:3px;font-size:10px;font-weight:800;color:var(--gold);background:#0009;padding:1px 6px;border-radius:6px}
#stage .mwrap.sold{opacity:.25;pointer-events:none;filter:grayscale(1)}
#lady{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid #ffffff10;border-radius:12px;padding:5px 10px;flex:none;margin-bottom:5px;transition:.3s}
#lady em{font-size:20px;font-style:normal}#lady div{flex:1;font-size:11px;line-height:1.25}#lady small{color:var(--mut)}#lady .pb{margin:3px 0 0;height:4px}
#lady.on{border-color:var(--gold);background:#3a2f0a;animation:pl 1s infinite alternate}#lady.on small{color:var(--gold)}
#bar{display:flex;align-items:center;min-height:30px;margin-bottom:5px;flex:none;background:#ffffff06;border-radius:10px;padding:4px 10px}
#info{flex:1;color:var(--mut);font-size:11px;line-height:1.35;text-align:center}#info b{color:#fff}
#ctl{display:flex;gap:6px;flex:none;align-items:stretch}
#ctl .chip{cursor:pointer;padding:0 10px;display:flex;align-items:center;justify-content:center;font-size:12px}
#multBtn{background:#252533;border:1.5px solid #ffffff26;color:var(--gold);font-weight:800;font-size:14px;min-width:52px;transition:.2s}
#multBtn.x5{background:#3a1824;border-color:#ff3355;color:#fff;box-shadow:0 0 12px #ff174455}
#go{position:relative;overflow:hidden;flex:1;font:inherit;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,#ff3355,#d4001a);border:0;border-radius:15px;padding:12px 8px;cursor:pointer;box-shadow:0 5px 18px #ff174455;transition:transform .12s;display:flex;align-items:center;justify-content:center;gap:6px}
#go::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:skewX(-20deg);animation:sw 2.8s infinite}@keyframes sw{to{left:140%}}
#go small{background:#0005;border-radius:10px;padding:2px 8px;font-size:13px}#go:active{transform:scale(.97)}#go:disabled{filter:grayscale(1) brightness(.55)}#go:disabled::after{display:none}
#dec{display:none;gap:6px;flex:none}
.dbt{flex:1;font:800 13px/1.15 Rubik,sans-serif;color:#fff;background:var(--card2);border:1.5px solid #ffffff2a;border-radius:14px;padding:11px 6px;cursor:pointer;animation:fin .2s}
.dbt.gold{background:var(--gold);color:#000;border:0}.dbt.junk{background:#2b1922;border-color:#ff546866;color:#ff99a6;flex:0.8}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6px + env(safe-area-inset-bottom,0px));width:min(490px,calc(100% - 12px));background:#16161cf2;backdrop-filter:blur(14px);border-radius:22px;padding:4px;display:flex;z-index:20;border:1px solid #ffffff14}
nav button{flex:1;position:relative;background:0;border:0;color:var(--mut);font:700 10.5px Rubik,sans-serif;padding:5px 0;border-radius:16px;cursor:pointer;transition:.2s}
nav button b{display:block;font-size:17px;font-weight:400;line-height:1.15;transition:transform .2s}
nav button.on{background:#ffffff1c;color:var(--ok)}nav button.on b{transform:translateY(-1px) scale(1.1)}
.sub{display:flex;gap:5px;margin-bottom:8px;flex:none;overflow-x:auto;scrollbar-width:none}
.sub button,.f{font:600 11.5px Rubik,sans-serif;color:#fff;background:var(--card);border:1.5px solid transparent;border-radius:13px;padding:6px 9px;cursor:pointer;white-space:nowrap;transition:.2s}
.sub button.on,.f.on{border-color:#fff;background:#ffffff1a}
#gtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;overflow:visible}#gtabs button{padding:6px 2px;font-size:10.5px;text-align:center}
.pb{height:6px;background:#ffffff1a;border-radius:4px;overflow:hidden;margin:5px 0;flex:none}.pb i{display:block;height:100%;background:linear-gradient(90deg,#ff3355,#ffd54a);transition:width .4s}
.chips{display:flex;gap:5px;overflow-x:auto;margin-bottom:5px;flex:none;scrollbar-width:none}
.st-head{flex:none;background:linear-gradient(145deg,#1d1730,#12121b);border:1px solid #ffffff14;border-radius:18px;padding:12px 14px;margin-bottom:8px}
.st-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.st-top small{display:block;color:var(--mut);font-size:10.5px;font-weight:600;margin-bottom:2px}
.st-val{font-size:22px;font-weight:800;color:var(--gold);line-height:1;white-space:nowrap}
.st-cnt{font-size:17px;font-weight:800;text-align:right;white-space:nowrap}.st-cnt span{color:var(--mut);font-size:13px;font-weight:600}
.st-bar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:#ffffff14;margin-top:10px}.st-bar i{display:block;height:100%;transition:width .4s}
.st-seg{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#ffffff0a;border-radius:13px;padding:3px;margin-bottom:7px}
.st-seg button{font:700 12px Rubik,sans-serif;color:var(--mut);background:0;border:0;border-radius:10px;padding:7px 4px;cursor:pointer;transition:.2s}
.st-seg button.on{background:#ffffff1f;color:#fff;box-shadow:0 2px 8px #0006}
.st-rar{flex:none;display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.st-rar button{font:700 11px Rubik,sans-serif;color:#fff;background:#ffffff0d;border:1.5px solid transparent;border-radius:11px;padding:5px 9px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:.15s}
.st-rar button i{width:8px;height:8px;border-radius:50%;background:var(--c,#fff);box-shadow:0 0 6px var(--c,transparent)}
.st-rar button em{font-style:normal;color:var(--mut);font-weight:600}
.st-rar button.on{border-color:var(--c,#fff);background:#ffffff1a}
.st-rar button.zero{opacity:.35}
.st-tools{flex:none;display:flex;gap:6px;margin-bottom:8px}.st-tools .f{flex:1;font-size:11.5px;text-align:center}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;overflow-y:auto;overflow-x:hidden;padding:2px 0 8px;align-content:start;-webkit-overflow-scrolling:touch}
#grid.compact{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cell{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;padding:12px 4px 9px;border-radius:16px;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 26%,#15151d),#101017 75%);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);box-shadow:0 4px 14px #0006,inset 0 1px 0 #ffffff12;transition:transform .15s}
.cell:active{transform:scale(.95)}
.cell.fav{box-shadow:0 0 0 1.5px #ffd54a88,0 4px 14px #0006}
.cell .cn{margin-top:8px;font-size:12px;font-weight:800;line-height:1;color:#fff}
.cell .cr{margin-top:3px;font-size:9.5px;font-weight:800;color:var(--c);text-transform:uppercase;letter-spacing:.03em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .cp{margin-top:5px;font-size:11.5px;font-weight:800;color:var(--gold);background:#0007;padding:2px 8px;border-radius:8px}
.cell .bn{position:absolute;z-index:6;top:5px;left:5px;font-size:11px;line-height:1;background:#000a;border:1px solid #ffd54a55;border-radius:8px;padding:2px 4px;font-weight:800;color:var(--gold)}
.cell .lk{position:absolute;top:5px;right:5px;background:#000b;border:1px solid #ffd54a66;border-radius:50%;width:19px;height:19px;font-size:10px;display:flex;align-items:center;justify-content:center;z-index:5}
#grid.compact .cell{padding:9px 2px 7px;border-radius:13px}#grid.compact .cell .cr{display:none}#grid.compact .cell .cn{margin-top:5px;font-size:11px}#grid.compact .cell .cp{font-size:10px;padding:1px 6px}
.st-empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:36px 10px;font-size:13px}.st-empty b{display:block;font-size:34px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid #ffffff0d;border-radius:13px;padding:8px 11px;margin-bottom:6px}
.row.me{border:1px solid #ff3355;background:#2a1018}.row b.n{width:28px;font-size:15px;color:var(--mut);text-align:center}.row>div:not(.tag){flex:1;min-width:0}.row{min-width:0}.row button{flex:none}.row small{display:block;color:var(--mut);font-size:11px}
.leader-row{pointer-events:none!important;user-select:none!important}.leader-row .nick{font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.up button{font:inherit;font-weight:800;font-size:12px;color:#000;background:var(--gold);border:0;border-radius:10px;padding:7px 11px;cursor:pointer;white-space:nowrap}.up button:disabled{opacity:.35}.up em{font-size:24px;font-style:normal}
table{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0 10px}td,th{padding:5px 4px;border-bottom:1px solid #ffffff14;text-align:right;color:var(--mut);font-weight:500}td:first-child,th:first-child{text-align:left;color:#fff}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

/* Меню Ещё (Категории и Кнопки) */
.more-cat{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:10px 4px 6px}
.more-cat:first-child{margin-top:2px}
.more-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;width:100%}
.hub-btn{min-width:0;width:100%;position:relative;background:var(--card);border:1.5px solid #ffffff14;border-radius:16px;padding:12px 11px;display:flex;align-items:center;gap:10px;color:#fff;cursor:pointer;text-align:left;transition:transform .14s,border-color .2s,background .2s}
.hub-btn:active{transform:scale(.96)}
.hub-btn.wide{grid-column:1 / -1}
#moreHub{width:100%;min-width:0}
.hub-info small{white-space:normal!important;line-height:1.25}
.hub-btn.accent{background:linear-gradient(135deg,#251238,#141122);border-color:#a855f755}
.hub-btn.gold-card{background:linear-gradient(135deg,#2b2108,#14120e);border-color:#ffd54a55}
.hub-icon{width:40px;height:40px;border-radius:12px;background:#ffffff0f;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.hub-info{min-width:0;flex:1}
.hub-info b{display:block;font-size:13.5px;font-weight:800;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub-info small{display:block;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subpage-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #ffffff14;flex:none}
.back-btn{background:#ffffff14;border:1px solid #ffffff24;color:#fff;border-radius:12px;padding:7px 12px;font:700 12px Rubik,sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px}
.back-btn:active{transform:scale(.95)}
.subpage-title{font-size:16px;font-weight:800;margin:0;flex:1}

.shop-head{background:linear-gradient(135deg,#251238,#12101e);border:1px solid #a855f755;border-radius:16px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.shop-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:10px}
.shop-item{background:var(--card);border:1.5px solid #ffffff14;border-radius:16px;padding:11px 10px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.shop-item.sale{border-color:#ffd54a88;background:linear-gradient(160deg,#281f09,#12121a)}
.sale-badge{position:absolute;top:6px;right:6px;background:var(--bad);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px}
.shop-icon{font-size:30px;margin-bottom:4px}.shop-title{font-weight:800;font-size:13px;line-height:1.2;margin-bottom:4px}.shop-desc{font-size:10.5px;color:var(--mut);line-height:1.3;margin-bottom:8px;flex:1}
.news-card{background:var(--card);border:1px solid #ffffff16;border-radius:16px;padding:12px;margin-bottom:8px}.news-card.pinned{border-color:#ff335588;background:linear-gradient(145deg,#240d15,#12121a)}
.news-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-bottom:4px}.news-title{font-weight:800;font-size:14px;color:var(--gold);margin-bottom:5px}.news-body{font-size:12px;color:#e2e2ee;line-height:1.45;white-space:pre-line}
#md{position:fixed;inset:0;z-index:90;background:#000d;display:none;align-items:center;justify-content:center;text-align:center;backdrop-filter:blur(6px);padding:14px}#md.on{display:flex}#md .f{margin:4px;font-size:13px;padding:9px 14px}
.adm-box,.prof-box{overflow-x:hidden;background:#14141d;border:1px solid #ffffff22;border-radius:20px;padding:14px;width:100%;max-width:450px;max-height:86vh;overflow-y:auto;text-align:left;box-shadow:0 12px 34px #000c;animation:fin .2s ease-out}
.adm-box h3{margin:10px 0 6px;color:var(--gold);font-size:14px}.adm-row{display:flex;gap:6px;margin-bottom:7px;align-items:center;flex-wrap:wrap}.adm-row>.adm-inp{flex:1 1 120px}
.adm-inp{flex:1;background:#09090f;border:1px solid #ffffff26;color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;min-width:0}
.adm-tabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto}.adm-tabs button{flex:1;padding:7px 5px;font-size:10.5px;font-weight:700;border-radius:10px;background:#ffffff0d;color:var(--mut);border:1px solid transparent;cursor:pointer;white-space:nowrap}.adm-tabs button.on{background:#2a1018;color:#fff;border-color:#ff3355}
.scard{background:var(--card);border:1px solid #ffffff12;border-radius:16px;padding:12px;margin-bottom:10px}.scard h3{margin:0 0 8px;font-size:14px;color:var(--gold);display:flex;align-items:center;gap:6px}
.seg-Group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:8px}.seg-btn{padding:8px 6px;border-radius:11px;border:1.5px solid #ffffff1a;background:#0b0b12;color:var(--mut);font-size:11px;font-weight:700;cursor:pointer;text-align:center;transition:.2s}.seg-btn.on{border-color:#ff3355;background:#2a1018;color:#fff;box-shadow:0 3px 10px #ff174433}
.prof-head{display:flex;align-items:center;gap:12px;background:#ffffff09;border:1px solid #ffffff14;border-radius:16px;padding:10px 12px;margin-bottom:10px}
.prof-ava{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#ff3355,#ff9100);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;flex:none}
.prof-title{font-size:11px;color:var(--gold);font-weight:700;text-transform:uppercase}.prof-best{background:radial-gradient(ellipse at 50% 30%,#ffffff12,#09090f 75%);border:1px solid #ffffff1a;border-radius:16px;padding:12px;text-align:center;margin-bottom:10px;display:flex;align-items:center;gap:14px;justify-content:center}.prof-best .tag{animation:none!important}

function burst(x,y,c,n){for(let i=0;i<n;i++){const s=document.createElement('s');s.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:7px;height:7px;border-radius:2px;background:${c||`hsl(${Math.random()*360} 100% 60%)`};pointer-events:none;z-index:85`;document.body.append(s);const a=Math.random()*6.28,d=50+Math.random()*160;s.animate([{transform:'none',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+50}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:850+Math.random()*450,easing:'ease-out'}).onfinish=()=>s.remove()}}

  const f=$('#fl');f.style.background=r==5?'conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)':`radial-gradient(circle,${RC[r]},transparent 70%)`;
  f.animate([{opacity:r>=3?.45:.12},{opacity:0}],{duration:r==5?1400:650});
  const b=$('#stage').getBoundingClientRect();
  burst(b.x+b.width/2,b.y+b.height/2,r==5?null:RC[r],[0,5,12,24,40,85][r]);
  hap(r>=4?'heavy':r>=2?'medium':'light');
  if(r>=4&&G.set.shake)document.body.animate([{transform:'translate(-5px,3px)'},{transform:'translate(5px,-3px)'},{transform:'translate(-3px,0)'},{transform:'none'}],{duration:r==5?650:320,iterations:r==5?2:1});
}
function addXp(x){
  const xpBoost = hasBoost('xp2') ? 2 : 1;
  const gain = Math.round(x * (1 + getSetBonus('xp')) * xpBoost);
  G.xp += gain;
  while(G.xp>=need(G.lv)){
    G.xp-=need(G.lv);G.lv++;
    const bonusC = 20 * G.lv;
    G.c+=bonusC;G.sp++;
    toast(`⬆️ Уровень ${G.lv}! +${fmt(bonusC)} ₽ и 🧠1`);
  }
}

function roll(t,bl,minR=0){
  const w=W(bl);
  for(let j=0;j<minR;j++)w[j]=0;
  let r=pick(w);
  const p=G.p[t];
  for(let j=3;j>=0;j--)if(p[j]>=LIM[j]-1&&r<j+2){r=j+2;break}
  for(let j=0;j<4;j++)p[j]=r>=j+2?0:p[j]+1;
  const n=P[r][Math.random()*P[r].length|0],it={id:G.nid++,n,r,t,wasNew:!G.col.includes(n)};
  G.items.push(it);G.rolls++;
  G.wipedHidden = false;
  if(!G.col.includes(n)) G.col.push(n);
  checkBest(it);
  {const bq=bonus(it);if(bq&&bq.big)G.st.bonus++;}
  if(r>=2)G.st.rare++;
  if(r===5)G.st.myth++;
  if(t===1)G.st.paper++;
  if(String(n).includes('67'))G.st.s67++;
  addXp(1+r*2);
  return it;
}

async function spin(){
  if(busy||pend.length)return;
  const freeSpace = cap() - G.items.length;
  if(freeSpace <= 0){toast('📦 Склад заполнен — продай что-нибудь');return}
  const actualCount = Math.min(spinMult, freeSpace);
  const unitCost = spinCost(ty);
  const totalCost = unitCost * actualCount;
  if(G.c < totalCost){toast('Не хватает денег на крутку');return}

  busy=true;
  G.c -= totalCost;
  G.spent += totalCost;

  const rolled = [];
  let gotBless = false, usedBless = false;
  const bStep = blessStep();

  for(let k=0; k<actualCount; k++){
    const bl = G.bless > 0;
    if(bl){ usedBless = true; G.bless = Math.max(0, G.bless - 1); }
    const it = roll(ty, bl, GUAR[gm].r);
    if(G.rolls % bStep === 0){ G.bless = (G.bless||0) + 1; gotBless = true; }
    rolled.push(it);
  }

  save();hud();hap('light');
  const F = G.set.fast ? .5 : 1;
  $('#rn').textContent = actualCount>1 ? `Крутим ×${actualCount}…` : 'Крутим…';
  $('#rn').style.color = 'var(--mut)';
  $('#val').textContent = '—';
  $$('#seg i').forEach(i=>i.style.background='');
  $('#info').innerHTML = usedBless ? '👵 <b>Гардеробщица помогла: удача повышена!</b>' : 'Удачи!';

  const stg = $('#stage');
  stg.classList.toggle('multi', actualCount > 1);
  const wSize = fit(actualCount);

  if(actualCount === 1){
    stg.innerHTML = tg(rolled[0], wSize, true);
  } else {
    stg.innerHTML = rolled.map(it=>`<div class="mwrap" data-id="${it.id}">${tg(it, wSize, true)}<small style="opacity:0">${fmt(price(it))} ₽</small></div>`).join('');
  }

  let maxT = 0;
  stg.querySelectorAll('.tag').forEach((tEl, idx)=>{
    const it = rolled[idx];
    const big = it.r >= 4;
    tEl.querySelectorAll('.st').forEach((st,ci,all)=>{
      const d=+st.dataset.d,arr=[];
      for(let i=0;i<20+ci*4+idx*2;i++)arr.push(Math.floor(Math.random()*10));
      arr.push(d);
      st.innerHTML=arr.map(x=>`<div>${x}</div>`).join('');
      const dur=(1.2+ci*.45+idx*.08+(big&&ci==all.length-1?.8:0))*F;
      st.style.transition=`transform ${dur}s cubic-bezier(.12,.8,.18,1)`;
      maxT=Math.max(maxT,dur);
      requestAnimationFrame(()=>requestAnimationFrame(()=>st.style.transform=`translateY(-${(arr.length-1)*1.1}em)`));
    });
  });

  const tick=setInterval(()=>{hap('soft');playTickSound(440+Math.random()*220,0.02)},150);
  await sleep(maxT*1000+200);
  clearInterval(tick);

  stg.querySelectorAll('.tag').forEach(tEl=>tEl.classList.add('rev'));
  stg.querySelectorAll('.mwrap small').forEach(sm=>sm.style.opacity='1');

  const best = [...rolled].sort((a,b)=>price(b)-price(a) || b.r-a.r)[0];
  const totalVal = rolled.reduce((a,i)=>a+price(i),0);

  $('#rn').textContent = actualCount>1 ? `Лучший: ${RN[best.r]} №${best.n}` : RN[best.r];
  $('#rn').style.color = RC[best.r];
  $('#val').textContent = fmt(totalVal)+' ₽';
  $$('#seg i').forEach((s,i)=>{if(i<=best.r)setTimeout(()=>s.style.background=RC[best.r],i*90)});
  document.documentElement.style.setProperty('--ac',RC[best.r]);
  $('#aura').style.opacity=.15+best.r*.06;

  let autoSoldCount = 0, autoSoldSum = 0;
  const maxAutoR = G.set.autoMode - 1;
  if(maxAutoR >= 0){
    const toSell = rolled.filter(i=>{
      if(i.r > maxAutoR) return false;
      if(G.set.keepBonus && (bonus(i)||{}).big) return false;
      if(G.set.keepNew && i.wasNew) return false;
      return true;
    });
    if(toSell.length){
      autoSoldCount = toSell.length;
      autoSoldSum = sell(toSell);
      toSell.forEach(c=>{
        const mw = stg.querySelector(`.mwrap[data-id="${c.id}"]`);
        if(mw) mw.classList.add('sold');
      });
    }
  }

  pend = rolled.filter(i=>G.items.includes(i));
  const df = totalVal - totalCost, col = df>=0?'var(--ok)':'var(--bad)';

  if(actualCount === 1){
    const it = rolled[0], bb = bonus(it);
    const bt = bb ? ` · <b style="color:var(--gold)">${bb.e} ${bb.n} ${bb.label}</b>` : '';
    $('#info').innerHTML = `<b>№${it.n}</b> · ${TN[it.t]}${bt} · Цена <b style="color:var(--gold)">${fmt(totalVal)} ₽</b> (<b style="color:${col}">${sg(df)} ₽</b>)` + (autoSoldCount?`<br><span style="color:var(--ok)">🧹 Авто-продано за ${fmt(autoSoldSum)} ₽</span>`:'');
  } else {
    $('#info').innerHTML = `Выпало <b>${actualCount} шт.</b> на <b style="color:var(--gold)">${fmt(totalVal)} ₽</b> (<b style="color:${col}">${sg(df)} ₽</b>)` + (autoSoldCount?` · 🧹 Авто-продано ${autoSoldCount} шт. (+${fmt(autoSoldSum)} ₽)`:' · <i>Нажми на номерок, чтобы продать отдельно</i>');
  }

  fx(best.r);
  if(best.r>=4)toast(best.r==5?'🌈 МИФИЧЕСКИЙ НОМЕРОК!!!':'🔥 Легендарный номерок!');
  if(gotBless)setTimeout(()=>toast('👵 Добрая гардеробщица: следующая крутка с повышенной удачей!'),1800);
  busy=false;
  save(true);
  hud();
}

function resolve(mode){
  if(!pend.length)return;
  if(mode === 'junk'){
    const junk = pend.filter(i=>i.r<=1);
    if(junk.length){
      const s = sell(junk);
      junk.forEach(c=>{
        const mw = $('#stage').querySelector(`.mwrap[data-id="${c.id}"]`);
        if(mw) mw.classList.add('sold');
      });
      pend = pend.filter(i=>!junk.includes(i));
      toast(`🧹 Продано ${junk.length} шт. за ${fmt(s)} ₽`);
    }
    save(true);hud();return;
  }
  const list = [...pend];
  pend = [];
  let msg;
  if(mode === 'sell'){
    const s = sell(list);
    msg = `Продано за <b style="color:var(--gold)">${fmt(s)} ₽</b>`;
  } else {
    msg = list.length>1 ? `📦 Оставлено на складе (${list.length} шт.)` : '📦 Номерок отправлен на склад';
  }
  $('#info').innerHTML = msg;
  hap('light');save(true);hud();
}
$('#d1').onclick=()=>resolve('keep');
$('#d2').onclick=()=>resolve('sell');
$('#dJunk').onclick=()=>resolve('junk');

function getShopRotation(){
  const slot15m = Math.floor(Date.now() / 900000);
  const seedBase = slot15m * 31 + (G.shopRef || 0) * 97;
  let sd = (seedBase ^ 0x6d2b79f5) >>> 0;
  const rnd = () => { sd = Math.imul(sd ^ (sd >>> 15), sd | 1) >>> 0; return (sd % 10000) / 10000; };
  const pool = [...SHOP_POOL];
  for(let i=pool.length-1; i>0; i--){
    const j = Math.floor(rnd() * (i+1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const scale = 1 + Math.max(0, (G.lv - 1) * 0.12);
  return pool.slice(0, 4).map((item, idx)=>{
    const isSale = idx === 0 && rnd() < 0.5;
    const rawCost = Math.round(item.baseCost * scale * (isSale ? 0.75 : 1));
    const cost = Math.max(500, Math.round(rawCost / 50) * 50);
    const key = `${slot15m}_${G.shopRef||0}_${item.id}`;
    return {...item, cost, isSale, buyKey: key};
  });
}

function setBal(v){
  const el=$('#bt');
  if(shown===null||shown===v){shown=v;el.textContent=fmt(v)+' ₽';return}

  el.classList.remove('up','dn');void el.offsetWidth;el.classList.add(v>f?'up':'dn');

function hasMoreNotifications(){
  const qPing = Q.some(q=>QV(q)>=QG(q));
  const achPing = ACHS.some(a=>!G.ach[a.id]&&a.c());
  const invNums = new Set(G.items.map(i=>i.n));
  const setPing = SETS.some(s=>!G.setsDone.includes(s.id) && s.nums.every(n=>invNums.has(n)||G.col.includes(n)));
  const trPing = allTrades.some(t=>t.status==='open' && (t.toUname===MY_UNAME || String(t.toUid)===String(MY_UID)));
  const latestNewsTs = Math.max(0, ...cloudNews.map(n=>n.ts||0));
  const newsPing = latestNewsTs > (G.seenNewsTs || 0);
  return {qPing, achPing, setPing, trPing, newsPing, any: (qPing || achPing || setPing || trPing || newsPing)};
}

  $('#sortBtn').textContent='↕️ '+SORTS[fSort].replace(/^\S+\s/,'');

  const l=byT.filter(i=>fR<0||i.r==fR).sort(sorters[fSort]);

function renderQuestsPage(container){
  container.innerHTML = Q.map((q,i)=>{
    const v=QV(q),t=QG(q);
    return `<div class="row up">
      <div>
        <b>${q.n}: ${fmt(t)}</b> <small style="display:inline">· этап ${QT(q)+1}</small>
        <div class="pb"><i style="width:${Math.min(100,v/t*100)}%"></i></div>
        <small>${fmt(Math.min(v,t))}/${fmt(t)} · награда <b style="color:var(--gold)">${fmt(QR(q))} ₽</b> + 🧠1</small>
      </div>
      <button data-q="${i}" ${v>=t?'':'disabled'}>Забрать</button>
    </div>`;
  }).join('');

  container.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
    const q=Q[b.dataset.q];if(QV(q)<QG(q))return;
    G.c+=QR(q);G.sp++;G.qt[q.k]=QT(q)+1;G.wipedHidden=false;
    toast(`🎯 Задание выполнено: +${fmt(QR(q))} ₽ и 🧠1`);hap('medium');
    save(true);hud();renderQuestsPage(container);
  });
}

function renderAchsPage(container){

async function fetchTrades(){
  if(!DB_BASE) return [];
  try{
    const r = await fetch(`${DB_BASE}/trades.json`);
    const d = await r.json();
    if(d && !d.error && typeof d === 'object'){
      allTrades = Object.values(d).filter(t=>t && t.id && t.status === 'open');
    } else { allTrades = []; }
    hud();
  }catch(e){}
  return allTrades;
}

/* Атомарно «забирает» трейд с сервера. Из двух одновременных действий (покупка / отмена)
   удаление пройдёт только у одного: Firebase отклоняет второй DELETE по ETag (412). */
async function claimTrade(id){
  const url = `${DB_BASE}/trades/${encodeURIComponent(id)}.json`;
  let etag = null, live = null;
  try{
    const r = await fetch(url, {headers:{'X-Firebase-ETag':'true'}, cache:'no-store'});
    etag = r.headers.get('ETag');
    live = await r.json();
  }catch(e){
    try{ live = await (await fetch(url, {cache:'no-store'})).json(); }
    catch(e2){ return {err:'net'}; }
  }
  if(!live || live.error || live.status !== 'open') return {gone:true};
  try{
    if(etag){
      const d = await fetch(url, {method:'DELETE', headers:{'if-match':etag}});
      if(d.ok) return {trade:live};
      return d.status === 412 ? {gone:true} : {err:'rules'};
    }
    /* запасной путь, если браузер не отдал ETag: «жребий». Оба клиента пишут свой токен,
       на сервере остаётся последний — проводит сделку только его владелец */
    const token = Date.now() + '_' + Math.random().toString(36).slice(2);
    if(!await putJson(`${DB_BASE}/trades/${encodeURIComponent(id)}/claim.json`, token)) return {err:'rules'};
    await sleep(800);
    const chk = await (await fetch(url, {cache:'no-store'})).json();
    if(!chk || chk.status !== 'open' || chk.claim !== token){
      if(chk && !chk.status) fetch(url, {method:'DELETE'}).catch(()=>{});   /* убираем огрызок, если трейд уже закрыт */
      return {gone:true};
    }
    const d = await fetch(url, {method:'DELETE'});
    return d.ok ? {trade:live} : {err:'rules'};
  }catch(e){ return {err:'net'}; }
}

async function putJson(url, obj, tries=3){
  for(let k=0;k<tries;k++){
    try{
      const r = await fetch(url, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(obj)});
      if(r.ok) return true;
    }catch(e){}
    await sleep(400);
  }
  return false;
}

function drawTrades(container){
  const incoming=allTrades.filter(trIsMine).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const outgoing=allTrades.filter(t=>String(t.fromUid)===String(MY_UID)).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const avail=G.items.filter(i=>!i.locked&&!pend.includes(i)).sort((a,b)=>price(b)-price(a));
  [...trSelectedIds].forEach(id=>{if(!avail.some(x=>x.id===id))trSelectedIds.delete(id)});
  const tabs=[['in','📥 Входящие',incoming.length],['new','✏️ Создать',0],['out','⏳ Мои',outgoing.length],['log','📜 История',0]];
  let body='';
  if(trTab==='in')body=incoming.length?incoming.map(trInCard).join(''):`<div class="tr-empty"><b>📭</b>Входящих предложений нет.<br>Когда друг отправит тебе номерок — он появится здесь.</div>`;
  else if(trTab==='new')body=trNewHTML(avail);
  else if(trTab==='out')body=outgoing.length?outgoing.map(trOutCard).join(''):`<div class="tr-empty"><b>📤</b>Активных предложений нет.<br>Создай трейд во вкладке «Создать».</div>`;
  else{const lg=(G.trLog||[]).slice().reverse();body=lg.length?lg.map(x=>`<div class="tr-log"><span>${esc(x.t)}</span><small>${trAgo(x.ts)}</small></div>`).join(''):`<div class="tr-empty"><b>📜</b>История пока пуста.</div>`}
  const prevPick=container.querySelector('.tr-pick'),pst=prevPick?prevPick.scrollTop:0,cst=container.scrollTop;
  container.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:8px"><span style="font-size:11px;color:var(--mut)">Каждая сделка проверяется сервером — дюп невозможен</span><button class="f" id="trRefreshBtn">🔄</button></div>
    <div class="st-seg tr-seg">${tabs.map(([k,n,c])=>`<button class="${trTab===k?'on':''}" data-trtab="${k}">${n}${c?`<b>${c}</b>`:''}</button>`).join('')}</div>${body}`;
  container.scrollTop=cst;
  const np=container.querySelector('.tr-pick');if(np)np.scrollTop=pst;
  bindTrades(container);
}

function bindTrades(container){
  const redraw=()=>drawTrades(container),refresh=()=>renderTradesPage(container);
  const toI=container.querySelector('#trTo');
  if(toI)toI.oninput=ev=>{
    trTo=ev.target.value;const u=trTo.replace(/^@/,'').trim().toLowerCase();
    container.querySelector('#trToState').innerHTML=trToStateHTML(u);
    container.querySelectorAll('[data-trpl]').forEach(b=>b.classList.toggle('on',b.dataset.trpl.toLowerCase()===u));
    container.querySelector('#trPreview').innerHTML=trPreviewHTML();
  };
  const askI=container.querySelector('#trAsk');
  if(askI)askI.oninput=ev=>{trAsk=ev.target.value;container.querySelector('#trPreview').innerHTML=trPreviewHTML()};

  container.onclick=async e=>{
    const b=e.target.closest('button');if(!b)return;
    const d=b.dataset;
    if(d.trtab){trTab=d.trtab;redraw();return}
    if(b.id==='trRefreshBtn'){refresh();return}
    if(d.trpl){trTo='@'+d.trpl;redraw();return}
    if(d.trmode){trMode=d.trmode;redraw();return}
    if(d.trask){
      const mk=trSelItems().reduce((a,i)=>a+price(i),0);
      if(!mk)return toast('Сначала выбери номерки на шаге 2');
      trAsk=String(Math.max(1,Math.round(mk*Number(d.trask))));
      redraw();return;
    }
    if(d.tid){
      const id=+d.tid;
      if(trSelectedIds.has(id))trSelectedIds.delete(id);
      else if(trSelectedIds.size>=10)return toast('Максимум 10 номерков в одном трейде');
      else trSelectedIds.add(id);
      b.classList.toggle('sel',trSelectedIds.has(id));
      const sel=trSelItems(),mk=sel.reduce((a,i)=>a+price(i),0);
      container.querySelector('#trSelInfo').innerHTML=sel.length?`Выбрано: <b style="color:#fff">${sel.length}</b> · рынок <b style="color:var(--gold)">${fmt(mk)} ₽</b>`:'Нажимай на номерки, чтобы выбрать (до 10 шт.).';
      container.querySelector('#trPreview').innerHTML=trPreviewHTML();
      return;
    }

    /* ---- отправка ---- */
    if(b.id==='trSendBtn'){
      if(trActionBusy)return;
      const toU=trTo.replace(/^@/,'').trim().toLowerCase();
      if(!toU)return toast('Шаг 1: укажи получателя');
      if(toU===MY_UNAME)return toast('Нельзя отправить трейд самому себе');
      const sel=trSelItems();
      if(!sel.length)return toast('Шаг 2: выбери хотя бы один номерок');
      const ask=trMode==='sell'?Math.max(0,Math.floor(Number(trAsk)||0)):0;
      if(trMode==='sell'&&ask<1)return toast('Шаг 3: укажи цену продажи');
      trActionBusy=true;b.disabled=true;
      let ok=false;
      try{
        const tp=cloudPlayers.find(p=>p.uname&&p.uname.toLowerCase()===toU);
        const trId='tr_'+Date.now()+'_'+Math.floor(Math.random()*1000);
        const trObj={id:trId,status:'open',ts:Date.now(),fromUid:MY_UID,fromUname:MY_UNAME,fromName:UN,toUid:tp?tp.uid:'',toUname:toU,items:sel.map(i=>({n:i.n,r:i.r,t:i.t})),sendCoins:0,askCoins:ask};
        const ids=new Set(sel.map(i=>i.id));
        G.items=G.items.filter(i=>!ids.has(i.id));
        G.st.trades++;
        save(true);hud();
        const posted=await putJson(`${DB_BASE}/trades/${trId}.json`,trObj);
        if(!posted){
          G.items.push(...sel);G.st.trades--;save(true);hud();
          toast('❌ Трейд не отправился — номерки возвращены на склад');
        }else{
          ok=true;
          logTr(`📤 Отправил @${toU}: ${sel.length} шт. · ${ask>0?'продажа за '+fmt(ask)+' ₽':'подарок'}`);
          save(true);
          toast(`🤝 Предложение отправлено @${toU}!`);
        }
      }finally{
        trActionBusy=false;
        if(ok){trTab='out';trSelectedIds.clear();trTo='';trAsk='';trMode='gift'}
        refresh();
      }
      return;
    }

    /* ---- принять / купить ---- */
    if(d.trAcc){
      if(trActionBusy)return;
      const id=d.trAcc;trActionBusy=true;b.disabled=true;
      try{
        const pre=await(await fetch(`${DB_BASE}/trades/${encodeURIComponent(id)}.json`,{cache:'no-store'})).json();
        if(!pre||pre.error||pre.status!=='open')return toast('⚠️ Этот трейд уже отменён или закрыт!');
        if(!trIsMine(pre))return toast('⚠️ Этот трейд адресован не тебе');
        if(pre.askCoins>0&&G.c<pre.askCoins)return toast('Не хватает денег для покупки');
        if(G.items.length+trItems(pre).length>cap())return toast('📦 Не хватает места на складе!');
        const cl=await claimTrade(id);
        if(cl.err)return toast(tradeErr(cl));
        if(cl.gone)return toast('⚠️ Этот трейд уже отменён или закрыт!');
        const lt=cl.trade,items=trItems(lt);
        if(lt.askCoins>0){
          const paid=await sendCommand([lt.fromUid,lt.fromUname],{addCoins:lt.askCoins,note:`@${MY_UNAME} купил твои номерки за ${fmt(lt.askCoins)} ₽!`,log:`💰 @${MY_UNAME} купил у тебя ${items.length} шт. за ${fmt(lt.askCoins)} ₽`});
          if(!paid){
            await putJson(`${DB_BASE}/trades/${encodeURIComponent(id)}.json`,lt);
            return toast('❌ Сделка не прошла (нет связи), попробуй ещё раз');
          }
          G.c-=lt.askCoins;
        }
        items.forEach(raw=>{const it={id:G.nid++,n:raw.n,r:raw.r,t:raw.t};G.items.push(it);if(!G.col.includes(it.n))G.col.push(it.n);checkBest(it)});
        G.st.trades++;G.wipedHidden=false;
        logTr(`📥 ${lt.askCoins>0?'Купил':'Получил в подарок'} ${items.length} шт. у @${lt.fromUname}${lt.askCoins>0?' за '+fmt(lt.askCoins)+' ₽':''}`);
        save(true);hud();
        burst(innerWidth/2,innerHeight/2,'#3fe06b',30);
        toast('✅ Сделка завершена! Номерки на складе');
      }catch(err){toast('❌ Ошибка сети — сделка не проведена')}
      finally{trActionBusy=false;refresh()}
      return;
    }

    /* ---- отклонить (получатель) / отменить (отправитель) ---- */
    if(d.trDec||d.trCancel){
      if(trActionBusy)return;
      const id=d.trDec||d.trCancel;trActionBusy=true;b.disabled=true;
      try{
        const cl=await claimTrade(id);
        if(cl.err)return toast(tradeErr(cl));
        if(cl.gone){await syncCloud();return toast('⚠️ Сделка уже завершена! Отмена невозможна.')}
        const lt=cl.trade,items=trItems(lt);
        if(String(lt.fromUid)===String(MY_UID)){
          items.forEach(raw=>G.items.push({id:G.nid++,n:raw.n,r:raw.r,t:raw.t}));
          logTr(`↩️ Отменил трейд для @${lt.toUname}`);
          save(true);hud();
          toast('↩️ Трейд отменён, номерки вернулись на склад');
        }else{
          const back=await sendCommand([lt.fromUid,lt.fromUname],{returnItems:items,note:`@${MY_UNAME} отклонил твой трейд — номерки вернулись`,log:`❌ @${MY_UNAME} отклонил твой трейд`});
          if(!back){await putJson(`${DB_BASE}/trades/${encodeURIComponent(id)}.json`,lt);return toast('❌ Не удалось отклонить (нет связи), попробуй ещё раз')}
          logTr(`❌ Отклонил трейд от @${lt.fromUname}`);save(true);
          toast('❌ Трейд отклонён');
        }
      }catch(err){toast('❌ Ошибка сети — попробуй ещё раз')}
      finally{trActionBusy=false;refresh()}
    }
  };
}

      </div>
    </div>
  `;

    const amt = Math.max(0, Math.floor(Number($('#payAmountInp').value || 0)));
    const getAmt = Math.floor(amt * 0.95);
    $('#payCalcInfo').innerHTML = amt >= 100
      ? `Спишется с баланса: <b style="color:#fff">${fmt(amt)} ₽</b> · Друг получит: <b style="color:var(--ok)">${fmt(getAmt)} ₽</b> (комиссия 5%)`

  };

  $('#payQuickSelect').onchange = e => { if(e.target.value) $('#payToInp').value = '@' + e.target.value; };
  $('#payAmountInp').oninput = updCalc;
  container.querySelectorAll('[data-pa]').forEach(b=>b.onclick=()=>{

  });

  $('#paySendBtn').onclick = async () => {
    if(payBusy) return;
    const toU = $('#payToInp').value.replace(/^@/,'').trim().toLowerCase();
    if(!toU) return toast('Укажи @username получателя');

    }
  };

let rkLoopId = 0, myRkBet = null, liveRkBets = {}, lastRkFetch = 0, lastFetchedRound = 0, lastHistRound = 0;

function getRoundCrash(roundId){
  let h = Math.imul(roundId ^ 0x5bd1e995, 1540483477);
  h = ((h ^ (h >>> 13)) >>> 0) / 4294967296;
  return h < 0.08 ? 1.00 : Math.min(20.0, Math.max(1.02, Math.floor((0.92 / (1 - h * 0.92)) * 100) / 100));
}

function getGlobalRocketState(now = Date.now()){
  const PERIOD = 22000;
  const roundId = Math.floor(now / PERIOD);
  const elapsed = (now % PERIOD) / 1000;
  const crash = getRoundCrash(roundId);
  const flyDur = Math.log(crash) / 0.24;
  if(elapsed < 10) return {roundId, phase:'wait', left: 10 - elapsed, mul: 1.00, crash};
  const flyTime = elapsed - 10;
  if(flyTime < flyDur) return {roundId, phase:'fly', flyTime, mul: Math.exp(0.24 * flyTime), crash};
  return {roundId, phase:'crash', mul: crash, crash, nextIn: Math.max(0, 22 - elapsed)};
}

function renderRocketHistory(currentRoundId, includeCurrent=false){
  const el = $('#rkHist'); if(!el) return;
  const rounds = [];
  if(includeCurrent) rounds.push(getRoundCrash(currentRoundId));
  for(let i=1; i<=9; i++) rounds.push(getRoundCrash(currentRoundId - i));
  el.innerHTML = `<span style="font-size:10px;color:var(--mut);font-weight:700">История:</span>` + rounds.map(c=>{
    const cls = c < 1.5 ? 'low' : c >= 4.0 ? 'high' : 'mid';
    return `<span class="rk-pill ${cls}">${c.toFixed(2)}×</span>`;
  }).join('');
}

async function postRocketBet(roundId, betObj){
  if(!DB_BASE) return;
  try{
    await fetch(`${DB_BASE}/rocket_bets/${roundId}/${MY_UID}.json`, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(betObj)
    });
    fetch(`${DB_BASE}/rocket_bets/${roundId-6}/${MY_UID}.json`, {method:'DELETE'}).catch(()=>{});
  }catch(e){}
}

async function fetchRocketBets(roundId){
  const now = Date.now();
  if(now - lastRkFetch < 1100 && lastFetchedRound === roundId) return;
  lastRkFetch = now;
  if(lastFetchedRound !== roundId){ liveRkBets = {}; lastFetchedRound = roundId; }
  if(!DB_BASE) return;
  try{
    const r = await fetch(`${DB_BASE}/rocket_bets/${roundId}.json`);
    const d = await r.json();
    if(d && !d.error && typeof d === 'object') liveRkBets = d;
  }catch(e){}
}

function onRocketBtn(){
  const st = getGlobalRocketState();
  if(st.phase === 'wait'){
    if(myRkBet && myRkBet.roundId === st.roundId) return toast('Ставка на этот раунд уже принята!');
    const b = getBet(); if(!b) return;
    G.c -= b;
    myRkBet = {roundId: st.roundId, uid: MY_UID, n: UN, b, cashed: 0, win: 0};
    liveRkBets[MY_UID] = myRkBet;
    save(true); hud();
    postRocketBet(st.roundId, myRkBet);
    toast(`🚀 Ставка ${fmt(b)} ₽ принята!`);
  } else if(st.phase === 'fly'){
    if(!myRkBet || myRkBet.roundId !== st.roundId || myRkBet.cashed) return;
    myRkBet.cashed = Number(st.mul.toFixed(2));
    const w = Math.floor(myRkBet.b * myRkBet.cashed);
    myRkBet.win = w;
    G.st.rkWin++;
    liveRkBets[MY_UID] = myRkBet;
    postRocketBet(st.roundId, myRkBet);
    fin(myRkBet.b, w, `🎉 Забрал на ×${myRkBet.cashed.toFixed(2)}`);
  }
}

function tickGlobalRocket(){
  if(!$('#s2').classList.contains('on') || gt !== 0) return;
  const st = getGlobalRocketState();
  fetchRocketBets(st.roundId);

  const histKey = st.roundId + '_' + (st.phase === 'crash' ? 1 : 0);
  if(lastHistRound !== histKey){
    lastHistRound = histKey;
    renderRocketHistory(st.roundId, st.phase === 'crash');
  }

  const mulEl = $('#mul'), stEl = $('#rkStatus'), rkEl = $('#rk'), btn = $('#gplay'), listEl = $('#rkBetsList');
  if(!mulEl) return;
  if(myRkBet && myRkBet.roundId !== st.roundId) myRkBet = null;

  if(st.phase === 'wait'){
    rkEl.className = '';
    rkEl.style.transform = 'translateX(-50%)';
    mulEl.textContent = `${st.left.toFixed(1)} с`;
    mulEl.style.color = '#fff';
    stEl.textContent = `⏳ Приём ставок (Раунд #${st.roundId % 1000})`;
    if(myRkBet){
      btn.textContent = `✅ Ставка ${fmt(myRkBet.b)} ₽ в игре (ждём старт)`;
      btn.disabled = true;
    } else {
      btn.textContent = `🚀 Поставить на раунд`;
      btn.disabled = false;
    }
  } else if(st.phase === 'fly'){
    rkEl.className = '';
    const k = Math.min(1, Math.log(st.mul) / Math.log(20));
    rkEl.style.transform = `translate(calc(-50% + ${k*55+Math.sin(st.flyTime*9)*3}px),${-k*84}px) rotate(${k*8}deg)`;
    mulEl.textContent = st.mul.toFixed(2) + '×';
    mulEl.style.color = 'var(--ok)';
    stEl.textContent = '🔥 Ракета летит!';
    if(myRkBet && !myRkBet.cashed){
      btn.disabled = false;
      btn.textContent = `💸 Забрать ${fmt(Math.floor(myRkBet.b * st.mul))} ₽ (×${st.mul.toFixed(2)})`;
    } else if(myRkBet && myRkBet.cashed){
      btn.disabled = true;
      btn.textContent = `✅ Забрано на ×${myRkBet.cashed.toFixed(2)} (+${fmt(myRkBet.win)} ₽)`;
    } else {
      btn.disabled = true;
      btn.textContent = 'Ракета в полёте (жди новый раунд)';
    }
  } else {
    rkEl.className = 'boom';
    mulEl.textContent = `💥 ${st.crash.toFixed(2)}×`;
    mulEl.style.color = 'var(--bad)';
    stEl.textContent = `Улетела! Новый раунд через ${st.nextIn.toFixed(0)} с`;
    if(myRkBet && !myRkBet.cashed && !myRkBet.lostHandled){
      myRkBet.lostHandled = true;
      fin(myRkBet.b, 0, `💥 Улетела на ×${st.crash.toFixed(2)}`);
    }
    btn.disabled = true;
    btn.textContent = `⏳ Новый раунд через ${st.nextIn.toFixed(0)} с`;
  }

  const betsArr = Object.values(liveRkBets).filter(x=>x && x.n && x.b);
  if(myRkBet && !liveRkBets[MY_UID]) betsArr.unshift(myRkBet);
  if(betsArr.length){
    listEl.innerHTML = `<div style="font-size:10px;color:var(--mut);margin-bottom:3px">Ставки игроков в раунде (${betsArr.length}):</div>` +
      betsArr.map(x=>{
        let status = `<span style="color:var(--gold)">В полёте (${fmt(x.b)} ₽)</span>`;
        if(x.cashed) status = `<span style="color:var(--ok)">×${Number(x.cashed).toFixed(2)} (+${fmt(x.win)} ₽)</span>`;
        else if(st.phase === 'crash') status = `<span style="color:var(--bad)">💥 Сгорело (${fmt(x.b)} ₽)</span>`;
        return `<div class="rk-bet-row"><b>${cleanNick(x.n)}</b>${status}</div>`;
      }).join('');
  } else {
    listEl.innerHTML = `<div style="color:var(--mut);font-size:11px;text-align:center">Ставок в этом раунде пока нет — будь первым!</div>`;
  }
  rkLoopId = requestAnimationFrame(tickGlobalRocket);
}

/* Атомарно «забирает» узел: из двух устройств удалить успеет только одно (ETag/If-Match) */
async function claimNode(url){
  const u=url+'.json';
  let etag=null,data=null;
  try{
    const r=await fetch(u,{headers:{'X-Firebase-ETag':'true'},cache:'no-store'});
    etag=r.headers.get('ETag');data=await r.json();
  }catch(e){return{err:1}}
  if(!data||data.error)return{gone:1};
  try{
    const d=await fetch(u,{method:'DELETE',headers:etag?{'if-match':etag}:{}});
    if(d.ok)return{data};
    return d.status===412?{gone:1}:{err:1};
  }catch(e){return{err:1}}
}

/* Очередь команд: commands/<ключ>/<cmdId>. Каждая команда — отдельный узел, ничего не перезаписывается */
async function sendCommand(keys,cmd){

  const body={...cmd,cmdId:id,ts:cmd.ts||Date.now()};

    if(await putJson(`${DB_BASE}/commands/${encodeURIComponent(k)}/${encodeURIComponent(id)}.json`,body))ok=true;
  }
  return ok;
}

function applyCommand(cmd){
  if(cmd.wipeAccount){performFullReset();return'reset'}
  G.wipedHidden=false;
  if(cmd.wipeMoney){G.c=0;G.items=[];G.best=null;G.wipedHidden=true;toast('💸 Администратор обнулил твой баланс и склад')}

  if(cmd.setCoins!==undefined){G.c=Math.max(0,Number(cmd.setCoins));G.wipedHidden=(G.c===0&&G.items.length===0)}
  if(cmd.addLv){G.lv=Math.max(1,G.lv+Number(cmd.addLv));G.sp+=Number(cmd.addLv)}
  if(cmd.giveNum){
    const num=Math.min(MAX_NUM,Math.max(1,Number(cmd.giveNum)));
    const it={id:G.nid++,n:num,r:RAR[num]||0,t:cmd.giveType||0};
    G.items.push(it);if(!G.col.includes(num))G.col.push(num);checkBest(it);
  }
  if(Array.isArray(cmd.returnItems)){
    cmd.returnItems.forEach(raw=>{const it={id:G.nid++,n:raw.n,r:raw.r,t:raw.t};G.items.push(it);if(!G.col.includes(it.n))G.col.push(it.n)});
  }

  if(!cmd.wipeMoney)toast(cmd.note?`⚡ ${cmd.note}`:'⚡ Получена выдача от Администратора!');
  return'ok';
}

async function processCommands(){

  const keys=[...new Set([String(MY_UID),MY_UNAME,cleanNick(UN).toLowerCase()].filter(Boolean))];
  for(const key of keys){
    const base=`${DB_BASE}/commands/${encodeURIComponent(key)}`;
    let q;
    try{q=await(await fetch(base+'.json',{cache:'no-store'})).json()}catch(e){continue}
    if(!q||typeof q!=='object'||q.error)continue;
    const legacy=typeof q.ts==='number'||typeof q.cmdId==='string';
    const list=legacy?[[null,q]]:Object.entries(q).filter(([,v])=>v&&typeof v==='object');
    for(const[id,c0]of list){
      const got=await claimNode(id===null?base:`${base}/${encodeURIComponent(id)}`);
      if(!got.data)continue;
      const c=got.data,ck=c.cmdId||id||('cmd_'+c.ts);
      if(G.usedCodes.includes(ck))continue;
      G.usedCodes.push(ck);
      const cp=G.usedCodes.filter(x=>x.startsWith('cp_')),rest=G.usedCodes.filter(x=>!x.startsWith('cp_')).slice(-200);
      G.usedCodes=[...cp,...rest];
      if(applyCommand(c)==='reset')return applied;
      applied++;
    }
  }
  return applied;
}

async function syncSave(){
  const force=forceMode;forceMode=null;
  const base=`${DB_BASE}/saves/${MY_UID}`;
  const h=hashStr(snapStr());
  const dirty=h!==G.syncedHash;
  let cloudRev=0;
  try{
    const rr=await fetch(base+'/rev.json',{cache:'no-store'});
    const rj=await rr.json();
    if(!rr.ok||(rj&&rj.error))return setSync('denied');
    cloudRev=Number(rj)||0;
  }catch(e){return setSync('offline')}
  if(!force&&cloudRev===(G.baseRev||0)&&!dirty&&cloudRev>0){setSync('ok');return}

  let r,cloud=null,etag=null;
  try{
    r=await fetch(base+'.json',{headers:{'X-Firebase-ETag':'true'},cache:'no-store'});
    etag=r.headers.get('ETag');cloud=await r.json();
  }catch(e){return setSync('offline')}
  if(!r.ok||(cloud&&cloud.error))return setSync('denied');

  const hasCloud=!!(cloud&&cloud.data&&cloud.rev);
  if(hasCloud){
    const obsolete=Number(cloud.wts||0)<knownWipeTs&&force!=='pull';
    if(!obsolete&&(force==='pull'||(force!=='push'&&Number(cloud.rev)!==(G.baseRev||0)))){
      let take=true;
      if(force!=='pull'){
        if(!G.baseRev){
          const lr=Number(G.rolls)||0,cr=Number(cloud.rolls)||0;
          take=!(lr>cr||(lr===cr&&G.updatedAt>(Number(cloud.ts)||0)));
        }else take=!dirty||(Number(cloud.ts)||0)>=G.updatedAt;
      }
      if(take){if(canAdopt())adoptCloud(cloud);setSync('ok');return}
    }
  }else if(!G.baseRev&&(Number(G.rolls)||0)===0&&force!=='push'){
    /* новое устройство, а в облаке пусто — пробуем старое сохранение из players/<id>/save */
    try{
      const lp=await(await fetch(`${DB_BASE}/players/${MY_UID}.json`,{cache:'no-store'})).json();
      if(lp&&!lp.error&&!lp.wiped&&lp.save&&Number(lp.save.rolls)>0&&Number(lp.save.lastWipeTs||0)>=knownWipeTs){
        if(canAdopt()&&adoptCloud({data:JSON.stringify(lp.save),ts:lp.save.updatedAt||lp.ts},true))return;
      }
    }catch(e){}
  }

  /* отправка: условный PUT — если за это время кто-то успел записать, сервер вернёт 412 */
  const snap=snapStr(),hh=hashStr(snap);
  const newRev=Math.max(Number(cloud&&cloud.rev)||0,G.baseRev||0)+1;
  const body={rev:newRev,dev:DEV,ts:G.updatedAt||Date.now(),wts:Number(G.lastWipeTs||0),rolls:G.rolls,lv:G.lv,data:snap};
  let pr;
  try{
    pr=await fetch(base+'.json',{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},etag?{'if-match':etag}:{}),body:JSON.stringify(body)});
  }catch(e){return setSync('offline')}
  if(pr.status===412){syncAgain=true;return}
  if(!pr.ok)return setSync('denied');
  G.baseRev=newRev;G.syncedHash=hh;persistLocal();setSync('ok');
}

async function pushProfile(){
  const totalW=worth(),isWiped=!!(G.wipedHidden||totalW<=0);
  const prof={uid:MY_UID,uname:MY_UNAME,n:UN,c:Math.round(Number(G.c)||0),r:isWiped?0:totalW,wiped:isWiped,lv:G.lv,rolls:G.rolls,best:isWiped?null:(G.best||null),ts:0};
  const ph=hashStr(JSON.stringify(prof));
  if(ph===lastProfHash&&Date.now()-lastProfTs<60000)return;
  prof.ts=Date.now();
  try{
    const res=await fetch(`${DB_BASE}/players/${MY_UID}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(prof)});
    if(res.ok){lastProfHash=ph;lastProfTs=Date.now()}else setSync('denied');
  }catch(e){}
}

async function syncOnce(){
  G.items.forEach(checkBest);
  await checkGlobalWipe();
  await syncSave();
  if(syncState==='denied'||syncState==='offline')return;
  const applied=await processCommands();
  if(applied){save(false);await syncSave()}
  await pushProfile();
}

function syncCloud(){
  if(!DB_BASE||isResetting)return Promise.resolve();
  if(syncLock){syncAgain=true;return syncLock}
  syncLock=(async()=>{
    try{
      let n=0;
      do{syncAgain=false;await syncOnce();n++}while(syncAgain&&!isResetting&&n<4);
    }catch(e){setSync('offline')}
    finally{syncLock=null}
  })();
  return syncLock;
}

async function forceSync(mode){
  forceMode=mode;setSync('busy');
  await syncCloud();
  return SYNC_TXT[syncState][0]+' '+SYNC_TXT[syncState][1];
}

async function initCloudRecovery(){
  if(!DB_BASE){cloudReady=true;hud();return}

  try{await syncCloud()}catch(e){}

}

/* ===== Защищённая Активация Купонов ===== */
let couponBusy = false;
const sessionPendingCodes = new Set();

async function redeemCoupon(raw){
  if(couponBusy) return;
  const code = (raw||'').trim().toUpperCase();
  if(!code) return;
  if(G.usedCodes.includes('cp_'+code) || sessionPendingCodes.has(code)){
    return toast('❌ Этот купон уже активирован!');
  }

  couponBusy = true;
  sessionPendingCodes.add(code);
  const btn = $('#promoBtn'), oldTxt = btn ? btn.textContent : 'Активировать';
  if(btn){ btn.disabled = true; btn.textContent = '⏳...'; }

  try{
    const r = await fetch(`${DB_BASE}/coupons/${encodeURIComponent(code)}.json`);
    const cp = await r.json();
    if(!cp || cp.error || !cp.code){
      sessionPendingCodes.delete(code);
      return toast('❌ Такого купона не существует');
    }
    if(cp.expiresAt && Date.now() > cp.expiresAt){
      sessionPendingCodes.delete(code);
      return toast('⌛ Срок действия купона истёк');
    }
    const usedBy = cp.usedBy || {}, usedCount = Object.keys(usedBy).length;
    if(usedBy[MY_UID]){
      G.usedCodes.push('cp_'+code); save(false);
      return toast('❌ Ты уже активировал этот купон');
    }
    if(cp.maxUses && usedCount >= cp.maxUses){
      sessionPendingCodes.delete(code);
      return toast('❌ Лимит активаций этого купона исчерпан');
    }
    if(cp.targetUser){
      const target = cp.targetUser.replace(/^@/,'').trim().toLowerCase();
      if(target && target !== MY_UNAME && target !== cleanNick(UN).toLowerCase()){
        sessionPendingCodes.delete(code);
        return toast(`❌ Этот купон создан лично для @${target}`);
      }
    }

    G.usedCodes.push('cp_'+code);
    await fetch(`${DB_BASE}/coupons/${encodeURIComponent(code)}/usedBy/${MY_UID}.json`, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(MY_UNAME || UN)
    });

    G.wipedHidden = false;
    if(cp.kind === 'C'){
      G.c += Number(cp.val||0);
      toast(`🎟️ Купон активирован: +${fmt(cp.val)} ₽!`);
    } else if(cp.kind === 'N'){
      const num = Math.min(MAX_NUM, Math.max(1, Number(cp.val||777)));
      const it = {id:G.nid++, n:num, r:RAR[num]||0, t:Number(cp.extra)||0};
      G.items.push(it); if(!G.col.includes(num)) G.col.push(num); checkBest(it);
      toast(`🎟️ Купон активирован: получен №${num} (${RN[it.r]})!`);
    } else if(cp.kind === 'L'){
      const lvAdd = Number(cp.val||1);
      G.lv += lvAdd; G.sp += lvAdd;
      toast(`🎟️ Купон активирован: +${lvAdd} к уровню и 🧠!`);
    }
    if($('#promoInp')) $('#promoInp').value = '';
    save(true); hud();
  }catch(e){
    sessionPendingCodes.delete(code);
    toast('❌ Ошибка сети при проверке купона');
  }finally{
    couponBusy = false;
    if(btn){ btn.disabled = false; btn.textContent = oldTxt; }
  }
}

    const rndCode = 'KPK' + Math.floor(1000 + Math.random()*9000);
    body.innerHTML = `
      <h3>Создать новый купон</h3>
      <div class="adm-row">
        <input class="adm-inp" id="cpCode" placeholder="Код купона" value="${rndCode}">
        <select class="adm-inp" id="cpKind" style="flex:0.9">
          <option value="C">💸 Деньги (₽)</option>
          <option value="N">🎫 Номерок (№)</option>
          <option value="L">⬆️ Уровни</option>
        </select>
      </div>
      <div class="adm-row">
        <input class="adm-inp" id="cpVal" type="number" placeholder="Сумма ₽ или № (1-999)" value="15000">
        <input class="adm-inp" id="cpUses" type="number" placeholder="Активаций" value="10" style="flex:0.7">
      </div>
      <div class="adm-row">
        <select class="adm-inp" id="cpTime">
          <option value="0">♾️ Бессрочный</option>
          <option value="15">⏱️ На 15 минут</option>
          <option value="60">⏱️ На 1 час</option>
          <option value="1440">⏱️ На 24 часа</option>
          <option value="10080">⏱️ На 7 дней</option>
        </select>
        <input class="adm-inp" id="cpTarget" placeholder="Для @username (пусто=всем)">
      </div>
      <button class="gbtn" id="cpCreate" style="padding:10px;font-size:13px;margin-bottom:10px">➕ Создать и скопировать купон</button>

      <h3>Активные купоны (${couponsList.length})</h3>
      <div style="max-height:150px;overflow-y:auto">
        ${couponsList.map(c=>{
          const used = c.usedBy ? Object.keys(c.usedBy).length : 0;
          const exp = c.expiresAt ? (Date.now()>c.expiresAt ? 'Истёк' : `до ${new Date(c.expiresAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`) : 'Бессрочный';
          return `<div class="row" style="padding:6px 8px;margin-bottom:4px">
            <div>
              <b style="color:var(--gold)">${c.code}</b> <small style="display:inline">(${c.kind==='C'?fmt(c.val)+' ₽':c.kind==='N'?'№'+c.val:'+'+c.val+' Ур'})</small>
              <small>Активаций: ${used}/${c.maxUses||1} · ${exp} ${c.targetUser?'· для @'+c.targetUser:''}</small>
            </div>
            <button class="f" data-delcp="${c.code}" style="padding:4px 8px;color:var(--bad)">🗑️</button>
          </div>`;
        }).join('') || '<div style="color:var(--mut);font-size:12px">Купонов пока нет</div>'}
      </div>`;

    $('#cpCreate').onclick = async () => {
      const code = $('#cpCode').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');
      if(!code) return toast('Введи код купона');
      const mins = Number($('#cpTime').value||0);
      const cpObj = {
        code, kind: $('#cpKind').value, val: Number($('#cpVal').value||1000),
        maxUses: Math.max(1, Number($('#cpUses').value||1)),
        expiresAt: mins > 0 ? Date.now() + mins * 60000 : 0,
        targetUser: $('#cpTarget').value.replace(/^@/,'').trim().toLowerCase(),
        createdAt: Date.now()
      };
      await admWrite('coupons/'+encodeURIComponent(code),'PUT',cpObj);
      navigator.clipboard && navigator.clipboard.writeText(code);
      toast(`🎟️ Купон ${code} создан и скопирован!`);
      renderAdminModal();
    };
    body.querySelectorAll('[data-delcp]').forEach(btn=>btn.onclick=async()=>{
      await admWrite('coupons/'+encodeURIComponent(btn.dataset.delcp),'DELETE');
      toast('🗑️ Купон удалён');
      renderAdminModal();
    });

  } else if(admTab === 4){
    body.innerHTML = `
      <h3>📰 Опубликовать новость для всех игроков</h3>
      <div class="adm-row"><input class="adm-inp" id="nwTitle" placeholder="Заголовок новости (напр. Новый сезон!)"></div>
      <div class="adm-row"><textarea class="adm-inp" id="nwBody" rows="3" placeholder="Текст новости или список обновлений..."></textarea></div>
      <button class="gbtn" id="nwPubBtn" style="padding:10px;font-size:13px;margin-bottom:10px">📢 Опубликовать в ленту</button>
      <h3>Опубликованные новости</h3>
      <div style="max-height:150px;overflow-y:auto">
        ${cloudNews.filter(n=>!String(n.id).startsWith('n_def')).map(n=>`<div class="row" style="padding:6px 8px;margin-bottom:4px">
          <div><b>${esc(n.title)}</b><small>${new Date(n.ts||Date.now()).toLocaleDateString('ru-RU')}</small></div>
          <button class="f" data-delnw="${esc(n.id)}" style="color:var(--bad)">🗑️</button>
        </div>`).join('') || '<div style="color:var(--mut);font-size:12px">Пользовательских новостей пока нет</div>'}
      </div>`;

    $('#nwPubBtn').onclick = async e => {
      const title = $('#nwTitle').value.trim(), text = $('#nwBody').value.trim();
      if(!title || !text) return toast('Заполни заголовок и текст новости');
      const btn = e.currentTarget;
      btn.disabled = true; btn.textContent = '⏳ Отправляю…';
      const id = 'nw_' + Date.now();
      try{
        const res = await fetch(admUrl('news/'+id), {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id, title, body:text, author:MY_UNAME, ts:Date.now()})});
        const data = await res.json().catch(()=>null);
        if(!res.ok || (data && data.error)){
          btn.disabled = false; btn.textContent = '📢 Опубликовать в ленту';
          return toast('❌ Firebase не принял новость (' + ((data && data.error) || res.status) + '). Проверь Rules для /news');
        }
      }catch(err){
        btn.disabled = false; btn.textContent = '📢 Опубликовать в ленту';
        return toast('❌ Нет связи с Firebase — новость не отправлена');
      }
      toast('📢 Новость опубликована!');
      renderAdminModal();
    };
    body.querySelectorAll('[data-delnw]').forEach(btn=>btn.onclick=async()=>{
      try{
        const res = await fetch(admUrl('news/'+btn.dataset.delnw), {method:'DELETE'});
        if(!res.ok) return toast('❌ Не удалось удалить новость (проверь Rules)');
      }catch(err){ return toast('❌ Нет связи с Firebase'); }
      toast('🗑️ Новость удалена');
      renderAdminModal();
    });
  }
}

async function performFullReset(){
  isResetting = true;
  clearTimeout(saveTimer);
  try{
    localStorage.removeItem(PREV_KEY);
    localStorage.removeItem(LEGACY_KEY);
    localStorage.setItem(KEY, JSON.stringify(defaultSave(knownWipeTs)));
  }catch(e){}
  if(DB_BASE){
    try{
      let rev=0;
      try{rev=Number(await(await fetch(`${DB_BASE}/saves/${MY_UID}/rev.json`,{cache:'no-store'})).json())||0}catch(e){}
      const body={rev:rev+1,dev:DEV,ts:Date.now(),wts:knownWipeTs,rolls:0,lv:1,data:snapOf(defaultSave(knownWipeTs))};
      await fetch(`${DB_BASE}/saves/${MY_UID}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    }catch(e){}
    try{ await fetch(`${DB_BASE}/players/${MY_UID}.json`, {method:'DELETE'}); }catch(e){}
  }
  location.reload();
}

$('#gb').onclick=e=>{
  if(!ready())return;
  const g=Math.round((45+5*G.lv)*(1+.12*(G.up.g||0)+getSetBonus('gift')));
  G.c+=g;G.gift=Date.now()+360000;G.wipedHidden=false;
  toast(`🎁 Подарок гардеробщика: +${fmt(g)} ₽`);
  burst(e.clientX||innerWidth/2,e.clientY||40,'#ffd54a',18);
  hap('medium');hud();save(true);
};

let lastShopSlot = Math.floor(Date.now() / 900000);
setInterval(()=>{
  const now = Date.now();
  const left=G.gift-now,b=$('#gb'),r=ready();
  b.classList.toggle('rdy',r);
  b.textContent=r?'🎁 Забрать':`🎁 ${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`;

  renderActiveBoostsBar();

  const curSlot = Math.floor(now / 900000);
  const shopLeft = Math.max(0, 900 - Math.floor((now % 900000)/1000));
  const stEl = $('#shopTimer');
  if(stEl) stEl.textContent = `Обновление через ${String(Math.floor(shopLeft/60)).padStart(2,'0')}:${String(shopLeft%60).padStart(2,'0')}`;
  if(curSlot !== lastShopSlot){
    lastShopSlot = curSlot;
    if($('#s4').classList.contains('on') && moreSub === 'shop') renderShopPage($('#morePageBody'));
  }
}, 500);

setInterval(()=>{if(document.visibilityState==='visible')syncCloud()}, 6000);
setInterval(()=>{if(document.visibilityState==='visible')fetchTrades()}, 12000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save(true);else syncCloud()});
addEventListener('focus',()=>syncCloud());
addEventListener('online',()=>syncCloud());
if(TG&&TG.onEvent)try{TG.onEvent('activated',()=>syncCloud())}catch(e){}

idle();hud();initCloudRecovery();
setTimeout(()=>{if(!busy&&!pend.length)idle()},250);
})();
