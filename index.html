    const pl = cloudPlayers, sum = f => pl.reduce((a,p)=>a+(Number(p[f])||0),0);
    const top = [...pl].sort((a,b)=>b.r-a.r).slice(0,5);
    body.innerHTML = `
      <div class="prof-stats">
        <div class="pstat"><small>Игроков в топе</small><b>${pl.length}</b></div>
        <div class="pstat"><small>Открытых трейдов</small><b>${allTrades.length}</b></div>
        <div class="pstat"><small>Всего ₽ на балансах</small><b style="color:var(--gold)">${fmt(sum('c'))} ₽</b></div>
        <div class="pstat"><small>Общее состояние</small><b style="color:var(--ok)">${fmt(sum('r'))} ₽</b></div>
        <div class="pstat"><small>Всего круток</small><b>${fmt(sum('rolls'))}</b></div>
        <div class="pstat"><small>Средний уровень</small><b>${pl.length?(sum('lv')/pl.length).toFixed(1):'—'}</b></div>
      </div>
      <h3>🏆 Топ-5 по состоянию</h3>
      ${top.map((p,i)=>`<div class="row" style="padding:7px 9px;margin-bottom:5px"><b class="n">${i+1}</b><div><b>${esc(cleanNick(p.n))}</b> <small style="display:inline;color:var(--gold)">@${esc(p.uname||'без_ника')}</small><small>Ур. ${p.lv||1} · ${fmt(p.r)} ₽</small></div></div>`).join('') || '<div style="color:var(--mut);font-size:12px">Пока пусто</div>'}
      <div class="adm-row" style="margin-top:8px">
        <button class="f" id="admStRefresh">🔄 Обновить</button>
        <button class="f" id="admTrReturn" style="color:var(--gold);border-color:#ffd54a44">↩️ Вернуть и закрыть все трейды</button>
      </div>`;
    $('#admStRefresh').onclick = () => renderAdminModal();
    $('#admTrReturn').onclick = async e => {
      if(!allTrades.length) return toast('Открытых трейдов нет');
      if(!e.target._c){e.target._c=1;e.target.textContent=`⚠️ Вернуть ${allTrades.length} трейдов? Ещё раз`;return}
      e.target.disabled = true;
      let n = 0;
      for(const t of [...allTrades]){
        await admWrite('trades/'+encodeURIComponent(t.id),'DELETE');
        await sendCommand([t.fromUid, t.fromUname], {returnItems:trItems(t), note:'Админ закрыл твой трейд — номерки вернулись на склад'});
        n++;
      }
      allTrades = [];
      toast(`↩️ Закрыто и возвращено трейдов: ${n}`);
      renderAdminModal();
    };

  } else if(admTab === 2){
    const filtered = cloudPlayers.filter(p=>{
      if(!admSearch) return true;
      const q = admSearch.toLowerCase();
      return (p.uname&&p.uname.toLowerCase().includes(q)) || cleanNick(p.n).toLowerCase().includes(q) || String(p.uid).includes(q);
    }).sort((a,b)=>b.r-a.r);

    body.innerHTML = `
      <div style="background:#2a0e16;border:1px solid #ff335566;border-radius:14px;padding:10px;margin-bottom:10px">
        <h3 style="margin:0 0 6px;color:#ff6b7d">☢️ Глобальный Вайп Сервера</h3>
        <div style="font-size:11px;color:var(--mut);margin-bottom:8px">Стирает данные у ВСЕХ игроков (включая их сохранения на телефонах) и полностью очищает Топ.</div>
        <div class="adm-row" style="margin-bottom:0">
          <button class="f" id="wipeAllMoneyBtn" style="flex:1 1 100%;border-color:#ffd54a66;color:var(--gold)">💸 Вайп денег и складов</button>
          <button class="f" id="wipeAllFullBtn" style="flex:1 1 100%;border-color:#ff5468;color:#ff6b7d">☢️ Полный вайп ВСЕГО</button>
        </div>
      </div>

      <h3>Игроки в Топе (${filtered.length})</h3>
      <div class="adm-row">
        <input class="adm-inp" id="admSearchInp" placeholder="🔍 Поиск по @нику, имени или ID..." value="${admSearch}">
      </div>
      <div style="max-height:210px;overflow-y:auto">
        ${filtered.map(p=>`<div class="row" style="padding:7px 9px;margin-bottom:5px">
          <div>
            <b>${cleanNick(p.n)}</b> <small style="display:inline;color:var(--gold)">@${p.uname||'без_ника'}</small>
            <small>Ур. ${p.lv||1} · Баланс: ${fmt(p.c??p.r)} ₽ · Сост: ${fmt(p.r)} ₽</small>
          </div>
          <button class="f" data-zero-uid="${p.uid}" title="Стереть деньги и скрыть из топа" style="padding:5px 7px;color:var(--gold);border-color:#ffd54a44">💸 0₽</button>
          <button class="f" data-del-uid="${p.uid}" title="Полный сброс игрока" style="padding:5px 7px;color:var(--bad);border-color:#ff546844">🗑️</button>
        </div>`).join('') || '<div style="color:var(--mut);font-size:12px">В топе сейчас пусто</div>'}
      </div>`;

    let wConfirm1 = 0, wConfirm2 = 0;
    $('#wipeAllMoneyBtn').onclick = async e => {
      if(!wConfirm1){ wConfirm1=1; e.target.textContent='⚠️ Точно? Нажми ещё раз'; return; }
      e.target.disabled = true; e.target.textContent = '⏳ Вайп...';
      const ts = Date.now();
      await admWrite('server/wipe','PUT',{ts, mode:'money'});
      await admWrite('players','DELETE'); await admWrite('saves','DELETE');
      await admWrite('trades','DELETE');
      G.c = 0; G.items = []; G.best = null; G.wipedHidden = true; G.lastWipeTs = ts;
      save(true); hud();
      toast('💸 Деньги и склады ВСЕХ игроков обнулены и убраны из топа!');
      renderAdminModal();
    };

    $('#wipeAllFullBtn').onclick = async e => {
      if(!wConfirm2){ wConfirm2=1; e.target.textContent='☢️ ТОЧНО СБРОСИТЬ ВСЁ?'; return; }
      e.target.disabled = true; e.target.textContent = '⏳ Полный вайп...';
      const ts = Date.now();
      await admWrite('server/wipe','PUT',{ts, mode:'full'});
      await admWrite('players','DELETE'); await admWrite('saves','DELETE');
      await admWrite('trades','DELETE');
      G = defaultSave(ts); G.wipedHidden = true;
      save(true); hud();
      toast('☢️ Полный вайп сервера выполнен!');
      renderAdminModal();
    };

    $('#admSearchInp').oninput = e => { admSearch = e.target.value; renderAdminModal(); };

    body.querySelectorAll('[data-zero-uid]').forEach(btn=>btn.onclick=async()=>{
      const uid = btn.dataset.zeroUid; if(!uid) return;
      btn.disabled = true; btn.textContent = '⏳';
      await admWrite('players/'+uid,'PATCH',{c:0, r:0, best:null, wiped:true}); await admWrite('saves/'+uid,'DELETE');
      await sendCommand([uid],{wipeMoney:1});
      if(String(uid) === String(MY_UID)){ G.c = 0; G.items = []; G.best = null; G.wipedHidden = true; save(false); hud(); }
      cloudPlayers = cloudPlayers.filter(x=>String(x.uid)!==String(uid));
      toast('💸 Деньги игрока стёрты, он скрыт из топа!');
      renderAdminModal();
      if($('#s3').classList.contains('on')) board();
    });

    body.querySelectorAll('[data-del-uid]').forEach(btn=>btn.onclick=async()=>{
      const uid = btn.dataset.delUid; if(!uid) return;
      btn.disabled = true; btn.textContent = '⏳';
      await admWrite('players/'+uid,'DELETE'); await admWrite('saves/'+uid,'DELETE');
      await sendCommand([uid],{wipeAccount:1});
      cloudPlayers = cloudPlayers.filter(x=>String(x.uid)!==String(uid));
      toast('🗑️ Аккаунт игрока полностью стёрт');
      renderAdminModal();
      if($('#s3').classList.contains('on')) board();
    });

  } else if(admTab === 3){
    let couponsList = [];
    try{
      const r = await fetch(admUrl('coupons'));
      const d = await r.json();
      if(d && !d.error) couponsList = Object.values(d).filter(c=>c&&c.code);
    }catch(e){}
    const rndCode = 'KPK' + Math.floor(1000 + Math.random()*9000);
    body.innerHTML = `
      <h3>Создать новый купон</h3>
      <div class="adm-row">
        <input class="adm-inp" id="cpCode" placeholder="Код купона" value="${rndCode}">
        <select class="adm-inp" id="cpKind" style="flex:0.9">
          <option value="C">💸 Деньги (₽)</option>
          <option value="N">🎫 Номерок (№)</option>
          <option value="L">⬆️ Уровни</option>
        </select>
      </div>
      <div class="adm-row">
        <input class="adm-inp" id="cpVal" type="number" placeholder="Сумма ₽ или № (1-999)" value="15000">
        <input class="adm-inp" id="cpUses" type="number" placeholder="Активаций" value="10" style="flex:0.7">
      </div>
      <div class="adm-row">
        <select class="adm-inp" id="cpTime">
          <option value="0">♾️ Бессрочный</option>
          <option value="15">⏱️ На 15 минут</option>
          <option value="60">⏱️ На 1 час</option>
          <option value="1440">⏱️ На 24 часа</option>
          <option value="10080">⏱️ На 7 дней</option>
        </select>
        <input class="adm-inp" id="cpTarget" placeholder="Для @username (пусто=всем)">
      </div>
      <button class="gbtn" id="cpCreate" style="padding:10px;font-size:13px;margin-bottom:10px">➕ Создать и скопировать купон</button>

      <h3>Активные купоны (${couponsList.length})</h3>
      <div style="max-height:150px;overflow-y:auto">
        ${couponsList.map(c=>{
          const used = c.usedBy ? Object.keys(c.usedBy).length : 0;
          const exp = c.expiresAt ? (Date.now()>c.expiresAt ? 'Истёк' : `до ${new Date(c.expiresAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`) : 'Бессрочный';
          return `<div class="row" style="padding:6px 8px;margin-bottom:4px">
            <div>
              <b style="color:var(--gold)">${c.code}</b> <small style="display:inline">(${c.kind==='C'?fmt(c.val)+' ₽':c.kind==='N'?'№'+c.val:'+'+c.val+' Ур'})</small>
              <small>Активаций: ${used}/${c.maxUses||1} · ${exp} ${c.targetUser?'· для @'+c.targetUser:''}</small>
            </div>
            <button class="f" data-delcp="${c.code}" style="padding:4px 8px;color:var(--bad)">🗑️</button>
          </div>`;
        }).join('') || '<div style="color:var(--mut);font-size:12px">Купонов пока нет</div>'}
      </div>`;

    $('#cpCreate').onclick = async () => {
      const code = $('#cpCode').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');
      if(!code) return toast('Введи код купона');
      const mins = Number($('#cpTime').value||0);
      const cpObj = {
        code, kind: $('#cpKind').value, val: Number($('#cpVal').value||1000),
        maxUses: Math.max(1, Number($('#cpUses').value||1)),
        expiresAt: mins > 0 ? Date.now() + mins * 60000 : 0,
        targetUser: $('#cpTarget').value.replace(/^@/,'').trim().toLowerCase(),
        createdAt: Date.now()
      };
      await admWrite('coupons/'+encodeURIComponent(code),'PUT',cpObj);
      navigator.clipboard && navigator.clipboard.writeText(code);
      toast(`🎟️ Купон ${code} создан и скопирован!`);
      renderAdminModal();
    };
    body.querySelectorAll('[data-delcp]').forEach(btn=>btn.onclick=async()=>{
      await admWrite('coupons/'+encodeURIComponent(btn.dataset.delcp),'DELETE');
      toast('🗑️ Купон удалён');
      renderAdminModal();
    });

  } else if(admTab === 4){
    body.innerHTML = `
      <h3>📰 Опубликовать новость для всех игроков</h3>
      <div class="adm-row"><input class="adm-inp" id="nwTitle" placeholder="Заголовок новости (напр. Новый сезон!)"></div>
      <div class="adm-row"><textarea class="adm-inp" id="nwBody" rows="3" placeholder="Текст новости или список обновлений..."></textarea></div>
      <button class="gbtn" id="nwPubBtn" style="padding:10px;font-size:13px;margin-bottom:10px">📢 Опубликовать в ленту</button>
      <h3>Опубликованные новости</h3>
      <div style="max-height:150px;overflow-y:auto">
        ${cloudNews.filter(n=>!String(n.id).startsWith('n_def')).map(n=>`<div class="row" style="padding:6px 8px;margin-bottom:4px">
          <div><b>${esc(n.title)}</b><small>${new Date(n.ts||Date.now()).toLocaleDateString('ru-RU')}</small></div>
          <button class="f" data-delnw="${esc(n.id)}" style="color:var(--bad)">🗑️</button>
        </div>`).join('') || '<div style="color:var(--mut);font-size:12px">Пользовательских новостей пока нет</div>'}
      </div>`;

    $('#nwPubBtn').onclick = async e => {
      const title = $('#nwTitle').value.trim(), text = $('#nwBody').value.trim();
      if(!title || !text) return toast('Заполни заголовок и текст новости');
      const btn = e.currentTarget;
      btn.disabled = true; btn.textContent = '⏳ Отправляю…';
      const id = 'nw_' + Date.now();
      try{
        const res = await fetch(admUrl('news/'+id), {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id, title, body:text, author:MY_UNAME, ts:Date.now()})});
        const data = await res.json().catch(()=>null);
        if(!res.ok || (data && data.error)){
          btn.disabled = false; btn.textContent = '📢 Опубликовать в ленту';
          return toast('❌ Firebase не принял новость (' + ((data && data.error) || res.status) + '). Проверь Rules для /news');
        }
      }catch(err){
        btn.disabled = false; btn.textContent = '📢 Опубликовать в ленту';
        return toast('❌ Нет связи с Firebase — новость не отправлена');
      }
      toast('📢 Новость опубликована!');
      renderAdminModal();
    };
    body.querySelectorAll('[data-delnw]').forEach(btn=>btn.onclick=async()=>{
      try{
        const res = await fetch(admUrl('news/'+btn.dataset.delnw), {method:'DELETE'});
        if(!res.ok) return toast('❌ Не удалось удалить новость (проверь Rules)');
      }catch(err){ return toast('❌ Нет связи с Firebase'); }
      toast('🗑️ Новость удалена');
      renderAdminModal();
    });
  }
}

async function performFullReset(){
  isResetting = true;
  clearTimeout(saveTimer);
  try{
    localStorage.removeItem(PREV_KEY);
    localStorage.removeItem(LEGACY_KEY);
    localStorage.setItem(KEY, JSON.stringify(defaultSave(knownWipeTs)));
  }catch(e){}
  if(DB_BASE){
    try{
      let rev=0;
      try{rev=Number(await(await fetch(`${DB_BASE}/saves/${MY_UID}/rev.json`,{cache:'no-store'})).json())||0}catch(e){}
      const body={rev:rev+1,dev:DEV,ts:Date.now(),wts:knownWipeTs,rolls:0,lv:1,data:snapOf(defaultSave(knownWipeTs))};
      await fetch(`${DB_BASE}/saves/${MY_UID}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    }catch(e){}
    try{ await fetch(`${DB_BASE}/players/${MY_UID}.json`, {method:'DELETE'}); }catch(e){}
  }
  location.reload();
}

$('#gb').onclick=e=>{
  if(!ready())return;
  const g=Math.round((45+5*G.lv)*(1+.12*(G.up.g||0)+getSetBonus('gift')));
  G.c+=g;G.gift=Date.now()+360000;G.wipedHidden=false;
  toast(`🎁 Подарок гардеробщика: +${fmt(g)} ₽`);
  burst(e.clientX||innerWidth/2,e.clientY||40,'#ffd54a',18);
  hap('medium');hud();save(true);
};

let lastShopSlot = Math.floor(Date.now() / 900000);
setInterval(()=>{
  if(document.hidden)return;
  const now = Date.now();
  const left=G.gift-now,b=$('#gb'),r=ready();
  b.classList.toggle('rdy',r);
  b.textContent=r?'🎁 Забрать':`🎁 ${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`;

  renderActiveBoostsBar();

  const curSlot = Math.floor(now / 900000);
  const shopLeft = Math.max(0, 900 - Math.floor((now % 900000)/1000));
  const stEl = $('#shopTimer');
  if(stEl) stEl.textContent = `Обновление через ${String(Math.floor(shopLeft/60)).padStart(2,'0')}:${String(shopLeft%60).padStart(2,'0')}`;
  if(curSlot !== lastShopSlot){
    lastShopSlot = curSlot;
    if($('#s4').classList.contains('on') && moreSub === 'shop') renderShopPage($('#morePageBody'));
  }
}, 1000);

setInterval(()=>{if(document.visibilityState==='visible')syncCloud()}, 10000);
setInterval(()=>{if(document.visibilityState==='visible')fetchTrades()}, 20000);
document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('hid',document.visibilityState==='hidden');if(document.visibilityState==='hidden')save(true);else syncCloud()});
addEventListener('focus',()=>syncCloud());
addEventListener('online',()=>syncCloud());
if(TG&&TG.onEvent)try{TG.onEvent('activated',()=>syncCloud())}catch(e){}

applyBg();idle();hud();initCloudRecovery();
setTimeout(()=>{if(!busy&&!pend.length)idle()},250);
})();
</script></body></html>
